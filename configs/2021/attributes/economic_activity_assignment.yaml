# Economic Activity Assignment for UK 2021/22
#
# Splits the working-age population by residence SGU, sex and age band into
# three states from the census economic-activity tables:
#
#   employed    in employment (employee or self-employed), incl. FT students
#   unemployed  economically active, looking for work
#   inactive    economically inactive (retired, student, home, sick, other)
#
# This runs BEFORE workplace_assignment. Only the EMPLOYED go on to get a
# workplace, sector and company place. Without this gate the pipeline assigns a
# physical workplace to every 18-64 adult, oversubscribing companies ~2.5x
# against real job supply.
#
# Sources: originally one file per nation harmonised to LGU x sex x age band
# and residence-based: EW (ONS RM024), SCT (NRS UV601a), NI (NISRA), covering
# all 374 UK local authorities. Drawing at LGU level was blind to output area,
# while `commutes` (the very next step) draws at SGU level — the two
# disagreed about which OAs have workers at all, which crashed create_world.py
# on 4 all-Scotland SGUs with zero worker signal in either SGU-level commute
# source. data/scripts/build_economic_activity_by_sgu.py reshapes the LGU
# table down to SGU using the commute signal, so `economic_activity` now
# agrees with `commutes` about where the workers are.
#
# Assignment Level: person

step:
  assignment_level: "person"

attributes:
  - name: "economic_activity"
    description: "employed, unemployed, or inactive"
    data_type: "categorical"

# Working-age population, the same window workplace_assignment gates on.
filters:
  age:
    attribute: "age"
    type: "numerical"
    description: "Working-age population"
    numerical:
      min: 18
      max: 64

# Age bands of the source table (16-24 / 25-34 / 35-49 / 50-64). The age filter
# above keeps everyone within 18-64, so the 16-24 band effectively covers 18-24.
categories:
  - name: "16-24"
    csv_value: "16-24"
    attribute: "age"
    type: "numerical"
    numerical: {min: 16, max: 24}
  - name: "25-34"
    csv_value: "25-34"
    attribute: "age"
    type: "numerical"
    numerical: {min: 25, max: 34}
  - name: "35-49"
    csv_value: "35-49"
    attribute: "age"
    type: "numerical"
    numerical: {min: 35, max: 49}
  - name: "50-64"
    csv_value: "50-64"
    attribute: "age"
    type: "numerical"
    numerical: {min: 50, max: 64}

data_sources:
  economic_activity_by_sgu_sex_age:
    type: "csv_lookup"
    format: "multi_key"
    description: "Economic-activity counts by residence SGU, sex and age band"

    # Built by data/scripts/build_economic_activity_by_sgu.py from the LGU
    # table below, commute_split_by_sgu_prepandemic.csv (the shaping signal;
    # same file commutes_assignment.yaml loads) and SGU population by single
    # year of age. Raked so it sums exactly back to
    # economic_activity_by_sgu_sex_age.csv per (LGU, sex, age band); an SGU
    # with zero commute signal (from_home + travels == 0) gets employed = 0
    # here, so it never draws "employed" in the first place.
    files:
      - path: "${data_root}/activities/work/economic_activity_by_sgu_sex_age.csv"

        key_columns:
          sgu:
            attribute: "geographical_unit"
            type: "ancestor_lookup"
            level: "SGU"
            property: "name"

          Sex:
            attribute: "sex"

          age_band:
            attribute: "age"
            type: "category_lookup"

        value_columns:
          employed: "employed"
          unemployed: "unemployed"
          inactive: "inactive"

# No fallback. Every (SGU, sex, age band) cell is populated (same SGU
# coverage as commutes_assignment.yaml's travel_to_work_split) so a miss
# means the geography and table have diverged.

assignment_rules:
  person:
    description: "Sample economic activity from the SGU/sex/age distribution"

    rules:
      - description: "Probabilistic economic activity by SGU, sex and age band"
        priority: 1

        assignment:
          strategy: "categorical_sampler"
          data_source: "economic_activity_by_sgu_sex_age"

settings:
  logging:
    show_attribute_distribution: true
