# Bus commute legs (RouteDistributor). Bus routes (D8 — synthetic
# per-LGU pseudo-routes) are generated: the routing table holds 5.81M
# mode_class=bus rows.
distributor_type: "route"
distributor_name: "route_commute_bus"

activity_map_key: "commute"
leg_venue_type: "bus_line"
leg_subset_key: "rider"

legs_table:   "${data_root}/activities/commute/route_legs.csv"

origin_source:
  type: "ancestor"
  from: "geographical_unit"
  level: "MGU"
destination_source:
  type: "ancestor"
  from: "properties.workplace_sgu"
  level: "MGU"

class_source: "properties.commute_mode"
class_filter: "bus"
class_map:
  bus: "bus"

require_properties:
  - "commute_mode"

leg_metadata:
  t_board_min:  "t_board_min"
  t_alight_min: "t_alight_min"

on_miss:
  set:
    commute_mode: "car_solo"

settings:
  verbose: true
