# Venue Configuration for MAY
#
# This file defines what venue types to load and how to load them.
# Users can easily add, remove, or configure venue types by editing this file.

# Venue types to load
# Each venue type can specify:
#   - enabled: Whether to load this venue type (default: true)
#   - filename: CSV file to load from, relative to venues data_dir (required
#               for enabled types; for batch_mode use a "{unit}" placeholder)
#   - is_residence: Whether people live at this venue type (default: false)
#   - description: Free-text note (not consumed by the engine)

venue_types:
  # SPECIAL: Household (created dynamically)
  # This venue type is NOT loaded from CSV - it's created by the household
  # distributor during world creation. We list it here only to mark it as
  # a residence type.
  household:
    enabled: false  # Created dynamically at runtime
    is_residence: true  # People live here
    description: "Residential households (created by household distributor)"
    
  hospital:
    enabled: true
    # Merged UK-wide venue table. Each row is a trust/board rather than a
    # single site, so bed and staff counts are the aggregate for that body
    # sited at its headquarters SGU.
    filename: medical/hospitals/hospitals.csv
    description: "Healthcare facilities providing medical treatment"
    is_residence: false  # Not a place where people live

  school:
    enabled: true
    filename: primary_activities/schools/Schools.csv
    description: "Educational institutions for primary and secondary education"
    is_residence: false  # Not a place where people live

  university:
    enabled: true
    # Merged UK-wide venue table. The four NI campuses are keyed on Small Area
    # codes like every other NI venue file; before the split they carried 2011
    # ward labels that matched no geography row, so filter_by_geography
    # silently dropped all of Northern Ireland.
    filename: primary_activities/universities/universities.csv
    description: "Higher education institutions"
    is_residence: false  # Not a place where people live

  care_home:
    enabled: true
    # Merged UK-wide venue table of homes for older adults. Column policy
    # stays strict (the default): the allocator reads a missing slot column as
    # zero and carries on, so a zero-filled union would hand a whole nation's
    # care homes no residents at all and raise nothing.
    filename: residences/care_homes/care_homes.csv
    description: "Residential care facilities for elderly or disabled persons"
    is_residence: true  # People live here

  prison:
    enabled: false
    filename: prisons.csv
    description: "Correctional institutions"
    is_residence: true  # People live here

  company:
    enabled: true
    # Merged UK-wide venue table of calibrated employer stocks. This is the
    # build the workplace-capacity weighting is aggregated from, so location,
    # sector and the company match all read the same employer stock.
    filename: primary_activities/companies/companies.csv
    description: "Commercial workplaces and businesses"
    is_residence: false  # Not a place where people live

  boarding_school:
    enabled: true
    # Merged UK-wide venue table. Boarder counts are the school's own returns
    # to the Independent Schools Council, split by sex. Every row's name and
    # geo_unit match a row in the corresponding schools file, so a boarding
    # residence always has a school counterpart. StatutoryLowAge/HighAge are
    # the boarding age range, which is narrower than the school's overall age
    # range wherever a school takes day pupils younger than its youngest
    # boarder.
    filename: residences/boarding_schools/boarding_schools.csv
    description: "Communal residence for school kids"
    is_residence: true  # People live here

  student_dorms:
    enabled: true
    # Merged UK-wide venue table. Counts are census residents in student
    # communal establishments, not bed capacity. England & Wales isolates
    # university halls specifically; Scotland and Northern Ireland publish
    # only a broader category, so those two carry some students living in
    # other kinds of establishment.
    filename: residences/student_dorms/student_dorms.csv
    description: "Communal residence for university students"
    is_residence: true  # People live here

  # The four leisure types are merged UK-wide venue tables. Rows are
  # individual premises located at an MGU with a lat/lon, so a nation's
  # contribution repeats an MGU once per venue in it. Unlike the residence
  # files, there is no per-row key.
  cinema:
    enabled: true
    filename: leisure/cinemas/cinemas.csv
    description: "Leisure location"
    is_residence: false

  grocery:
    enabled: true
    filename: leisure/groceries/groceries.csv
    description: "Leisure location"
    is_residence: false

  gym:
    enabled: true
    filename: leisure/gyms/gyms.csv
    description: "Leisure location"
    is_residence: false

  pub:
    enabled: true
    filename: leisure/pubs/pubs.csv
    description: "Leisure location"
    is_residence: false

  # SPECIAL: Transport-line venues (created dynamically by RouteDistributor)
  # Materialised lazily by RouteDistributor, one venue per train/tube/bus
  # line_id, populated with `rider` subsets that carry per-membership
  # (t_board_min, t_alight_min) metadata (see Subset.member_metadata, and the
  # /activity_mappings/membership_metadata HDF5 side-table from Design B).
  #
  # Split per-mode (train/tube/bus) so JUNE's per-mode contact matrices in
  # contact_matrices.yaml (train_line / tube_line / bus_line) match. Each
  # RouteDistributor instance writes legs into its mode-specific type.
  #
  # supports_partial_presence is consumed JUNE-side via JUNE's own config
  # (contact_matrices.yaml-style declaration keyed by venue type name);
  # it is not serialised from here.
  train_line:
    enabled: false  # Created dynamically by RouteDistributor
    is_residence: false
    description: "Per-line commute venue (train / rail)"
  tube_line:
    enabled: false
    is_residence: false
    description: "Per-line commute venue (tube / metro / light rail)"
  bus_line:
    enabled: false
    is_residence: false
    description: "Per-line commute venue (bus pseudo-route)"

# Global venue settings
settings:
  # Filter venues to only include those in loaded geographical units
  filter_by_geography: true